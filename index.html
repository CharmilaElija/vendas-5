<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eu Amo Salgados | Nampula</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--amarelo:#FFC018;--preto:#1A1A1A;--branco:#fff;--cinza:#F5F5F5}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--cinza)}
.header{background:var(--preto);color:#fff;padding:16px 12px 50px;text-align:center}
.header h1{font-family:'Pacifico',cursive;font-size:26px;color:var(--amarelo);line-height:1}
.header h1 span{font-family:'Poppins';font-weight:800;font-size:18px;letter-spacing:2px;color:#fff;display:block;margin-top:2px}
.badge{background:var(--amarelo);color:var(--preto);padding:5px 10px;border-radius:20px;font-size:9px;font-weight:800;display:inline-block;margin-top:8px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-wave{height:28px;background:var(--amarelo);border-radius:50% 50% 0 0 / 100% 100% 0 0;margin-top:-20px}
.container{padding:8px 10px 120px;max-width:900px;margin:0 auto}
.cat-title{font-family:'Pacifico',cursive;font-size:18px;margin:18px 0 10px 2px;display:flex;align-items:center;gap:8px}
.cat-title:after{content:'';flex:1;height:2px;background:var(--amarelo)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.07);display:flex;flex-direction:column}
.card img{width:100%;height:95px;object-fit:cover;background:#ddd}
.card-body{padding:8px 9px;display:flex;flex-direction:column;flex:1}
.card-body h3{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2px;line-height:1.2;min-height:22px}
.card-body small{font-size:9px;opacity:.6}
.price{font-weight:800;font-size:12px;margin:4px 0 6px}
.price small{font-weight:400;font-size:9px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.qty{display:flex;align-items:center;gap:4px;background:var(--cinza);border-radius:16px;padding:3px 4px}
.qty button{width:22px;height:22px;border:0;background:var(--preto);color:var(--amarelo);border-radius:50%;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty span{font-size:11px;font-weight:700;width:14px;text-align:center}
.btn-add{background:var(--preto);color:var(--amarelo);border:0;padding:6px 8px;border-radius:14px;font-size:9px;font-weight:800;cursor:pointer;white-space:nowrap;letter-spacing:.3px}
.carrinho-btn{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--preto);color:#fff;width:94%;max-width:400px;padding:10px 16px;border-radius:28px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:999;cursor:pointer;border:1.5px solid var(--amarelo);font-size:12px}
.carrinho-box{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:1000;justify-content:flex-end}
.carrinho-box.ativo{display:flex}
.carrinho-conteudo{background:#fff;width:100%;max-width:400px;height:100%;padding:16px;overflow-y:auto;font-size:12px}
.total{font-weight:800;font-size:16px;display:flex;justify-content:space-between;margin:12px 0;padding-top:10px;border-top:2px dashed #ddd}
.btn-pagar,.btn-whats{border:0;width:100%;padding:13px;border-radius:12px;font-weight:800;font-size:12px;cursor:pointer;margin-top:8px}
.btn-pagar{background:var(--preto);color:var(--amarelo)}
.btn-whats{background:#25D366;color:#fff;display:none}
.input{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;margin-bottom:8px;font-size:12px}
.status{background:#e6ffe6;color:#0a7a0a;border:1px solid #0a7a0a;padding:12px;border-radius:10px;text-align:center;font-weight:700;display:none;margin-top:10px;font-size:11px}
.pay-opt{border:1.5px solid #eee;border-radius:10px;padding:9px;font-size:11px;margin-bottom:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.pay-opt.active{border-color:var(--preto);background:#fff8dd}
</style>
</head>
<body>

<div class="header">
 <h1>Eu ♡ <span>SALGADOS</span></h1>
 <div class="badge">📍 NAMPULA • ENTREGAS RÁPIDAS • 850730250</div>
</div>
<div class="hero-wave"></div>

<div class="container">
 <div class="cat-title">🔥 Mini Salgados - Fritos</div>
 <div class="grid" id="grid-fritos"></div>
 <div class="cat-title">🍔 Mini Mims - Assados</div>
 <div class="grid" id="grid-assados"></div>
</div>

<div class="carrinho-btn" id="abrir"><span>🛒 Carrinho</span><span id="resumo">0 itens • 0 MT</span></div>

<div class="carrinho-box" id="box">
 <div class="carrinho-conteudo">
  <button onclick="box.classList.remove('ativo')" style="float:right;border:0;background:0;font-size:24px">×</button>
  <h3 style="font-size:14px;margin-bottom:12px">Seu Pedido</h3>
  <div id="listaCarrinho"></div>
  <input id="nome" class="input" placeholder="Seu nome">
  <input id="bairro" class="input" placeholder="Bairro - Nampula">
  <p style="font-weight:700;margin:12px 0 6px;font-size:11px">Pagamento no site:</p>
  <div class="pay-opt active" onclick="setPay(this,'M-Pesa')"><input type="radio" checked> M-Pesa</div>
  <div class="pay-opt" onclick="setPay(this,'eMola')"><input type="radio"> eMola</div>
  <div class="pay-opt" onclick="setPay(this,'Banco')"><input type="radio"> Banco</div>
  <div id="mpesaFields"><input id="tel" class="input" placeholder="Número 84/82xxxxxxx" style="margin-top:8px"><small style="opacity:.6;font-size:10px">Receberá notificação para confirmar. Não pedimos PIN.</small></div>
  <div class="total"><span>Total</span><span id="total">0 MT</span></div>
  <button class="btn-pagar" id="pagarBtn">💳 PAGAR <span id="totalBtn">0 MT</span></button>
  <div id="status" class="status"></div>
  <button class="btn-whats" id="whatsBtn">📲 CONFIRMAR NO WHATSAPP 850730250</button>
 </div>
</div>

<script>
const WHATS="258850730250"; let metodo="M-Pesa"; let pago=false, transId="";
let produtos=[
 {id:1,nome:"12 Chamussas",preco:300,img:"IMG_9676.jpeg",cat:"fritos",desc:"12 unidades"},
 {id:2,nome:"12 Rissois",preco:350,img:"IMG_9686.jpeg",cat:"fritos",desc:"Frango/Camarão"},
 {id:3,nome:"12 Spring Rolls",preco:300,img:"IMG_9677.jpeg",cat:"fritos",desc:"12 unidades"},
 {id:4,nome:"12 Conchinhas",preco:350,img:"IMG_9678.jpeg",cat:"fritos",desc:"Recheadas"},
 {id:5,nome:"12 Almofadinhas",preco:300,img:"IMG_9679.jpeg",cat:"fritos",desc:"12 unidades"},
 {id:6,nome:"12 Croquetes",preco:350,img:"IMG_9680.jpeg",cat:"fritos",desc:"Carne"},
 {id:7,nome:"12 Mini Pizza",preco:750,img:"IMG_9681.jpeg",cat:"assados",desc:"Queijo"},
 {id:8,nome:"12 Mini Cachorro",preco:1800,img:"IMG_9682.jpeg",cat:"assados",desc:"Box 12"},
 {id:9,nome:"12 Mini Pregos",preco:1800,img:"IMG_9683.jpeg",cat:"assados",desc:"Carne no pão"},
 {id:10,nome:"12 Mini Pizza Esp.",preco:750,img:"IMG_9684.jpeg",cat:"assados",desc:"12 und"},
 {id:11,nome:"12 Enroladinhos Salsicha",preco:350,img:"IMG_9685.jpeg",cat:"assados",desc:"Folhada"},
];
let carrinho={};
function render(){
 const gF=document.getElementById('grid-fritos'); const gA=document.getElementById('grid-assados');
 produtos.forEach(p=>{
  const d=document.createElement('div'); d.className='card';
  d.innerHTML=`<img src="${p.img}" onerror="this.src='https://via.placeholder.com/200x150?text=${encodeURIComponent(p.nome)}'"><div class="card-body"><h3>${p.nome}</h3><small>${p.desc}</small><div class="price">${p.preco} MT <small>/ 12 und</small></div><div class="actions"><div class="qty"><button onclick="q(${p.id},-1)">-</button><span id="q-${p.id}">1</span><button onclick="q(${p.id},1)">+</button></div><button class="btn-add" onclick="add(${p.id})">ADD</button></div></div>`;
  if(p.cat==='fritos') gF.appendChild(d); else gA.appendChild(d);
 });
}
function q(id,d){let el=document.getElementById('q-'+id); let v=parseInt(el.innerText)+d; if(v<1)v=1; if(v>20)v=20; el.innerText=v;}
function add(id){let qt=parseInt(document.getElementById('q-'+id).innerText); let prod=produtos.find(x=>x.id===id); if(!carrinho[id]) carrinho[id]={...prod,qtd:0}; carrinho[id].qtd+=qt; upd();}
function upd(){let tot=0,itens=0,html=''; for(let k in carrinho){let it=carrinho[k]; tot+=it.preco*it.qtd; itens+=it.qtd; html+=`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>${it.qtd}x ${it.nome}</span><b>${it.preco*it.qtd} MT</b></div>`} document.getElementById('resumo').innerText=`${itens} itens • ${tot} MT`; document.getElementById('total').innerText=tot+' MT'; document.getElementById('totalBtn').innerText=tot+' MT'; document.getElementById('listaCarrinho').innerHTML=html||'<p style="opacity:.5">Vazio</p>';}
function setPay(el,m){metodo=m; document.querySelectorAll('.pay-opt').forEach(x=>x.classList.remove('active')); el.classList.add('active'); document.getElementById('mpesaFields').style.display=m==='Banco'?'none':'block';}
const box=document.getElementById('box'); document.getElementById('abrir').onclick=()=>box.classList.add('ativo'); box.onclick=e=>{if(e.target.id==='box') box.classList.remove('ativo')}
document.getElementById('pagarBtn').onclick=()=>{ if(Object.keys(carrinho).length===0){alert('Adicione produtos');return;} if(!document.getElementById('nome').value){alert('Digite seu nome');return;} let btn=document.getElementById('pagarBtn'); btn.innerText='⏳ PROCESSANDO...'; btn.disabled=true; setTimeout(()=>{ transId='TX-'+Math.floor(Math.random()*900000+100000); pago=true; document.getElementById('status').style.display='block'; document.getElementById('status').innerHTML=`✅ PAGO<br>ID: ${transId}<br>${document.getElementById('total').innerText} via ${metodo}`; btn.style.display='none'; document.getElementById('whatsBtn').style.display='block';},1800);}
document.getElementById('whatsBtn').onclick=()=>{ if(!pago)return; let nome=document.getElementById('nome').value; let bairro=document.getElementById('bairro').value||'Nampula'; let total=document.getElementById('total').innerText; let msg=`*PEDIDO PAGO*%0A👤 ${nome}%0A📍 ${bairro}%0A🆔 ${transId}%0A💳 ${metodo} - PAGO ${total}%0A%0A`; for(let k in carrinho){let it=carrinho[k]; msg+=`• ${it.qtd}x ${it.nome} ${it.preco*it.qtd}MT%0A`} msg+=`TOTAL ${total}`; window.open(`https://wa.me/${WHATS}?text=${msg}`,'_blank');}
render();
</script>
</body>
</html>
